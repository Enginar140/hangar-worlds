name: release

# Push a tag like v0.2.0 to publish a release with an archive of the worlds.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag has a changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## ${version}\b" CHANGELOG.md || (echo "::error::CHANGELOG.md has no '## ${version}' section"; exit 1)
          awk -v v="## ${version}" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > NOTES.md
      - name: Archive
        run: |
          name="hangar-worlds-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          sha256sum "${name}.tar.gz" > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" hangar-worlds-*.tar.gz SHA256SUMS --verify-tag --title "hangar-worlds ${GITHUB_REF_NAME#v}" --notes-file NOTES.md
